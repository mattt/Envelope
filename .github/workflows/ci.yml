name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-macos:
    name: Swift ${{ matrix.swift }} on macOS ${{ matrix.macos }} with Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runs-on }}
    env:
      DEVELOPER_DIR: "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.1"
            xcode: "16.3"
            macos: "15"
            runs-on: macos-15
          - swift: "6.2"
            xcode: "26.0"
            macos: "26"
            runs-on: macos-26
          - swift: "6.3"
            xcode: "26.4"
            macos: "26"
            runs-on: macos-26
          # The xcode-27 image is a public preview that runs macOS 27.
          - swift: "6.4"
            xcode: "27.0"
            macos: "27"
            runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            .build
            .build-asan
          key: ${{ runner.os }}-swift-${{ matrix.swift }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-${{ matrix.swift }}-spm-

      - name: Lint
        run: swift format lint --strict --recursive .

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: MIME sanitizer mutations
        run: python3 Tools/fuzz.py --count 10000
